<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TO HARI💖</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #ff758c, #ff7eb3);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    padding: 20px;
}

/* Floating hearts */
.heart {
    position: absolute;
    color: rgba(255,255,255,0.7);
    font-size: 20px;
    animation: float 6s linear infinite;
}

@keyframes float {
    0% {
        transform: translateY(100vh) scale(1);
        opacity: 1;
    }
    100% {
        transform: translateY(-10vh) scale(1.5);
        opacity: 0;
    }
}

/* Card */
.card {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 30px 25px;
    text-align: center;
    box-shadow: 0 0 30px rgba(255,255,255,0.3);
    animation: fadeIn 1.5s ease;
    max-width: 350px;
    width: 100%;
}

@keyframes fadeIn {
    from { opacity: 0; transform: scale(0.8); }
    to { opacity: 1; transform: scale(1); }
}

h1 {
    color: white;
    font-size: clamp(1.8rem, 4vw, 2.5rem);
    margin-bottom: 20px;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from { text-shadow: 0 0 10px #fff; }
    to { text-shadow: 0 0 25px #ffd6e8; }
}

.btn-container {
    position: relative;
    height: 150px;
    margin-top: 20px;
}

button {
    padding: 12px 25px;
    font-size: 1rem;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
}

#yesBtn {
    background: #ff4d6d;
    color: white;
    box-shadow: 0 0 10px rgba(255,255,255,0.6);
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.1); }
    100% { transform: scale(1); }
}

#yesBtn:hover {
    transform: scale(1.15);
}

#noBtn {
    background: #555;
    color: white;
    position: absolute;
    top: 70px;
    left: 120px;
}

#message {
    margin-top: 20px;
    font-size: clamp(1.2rem, 3vw, 1.5rem);
    color: white;
    font-weight: bold;
    animation: fadeIn 1s ease;
}
#photoGallery {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
}

#photoGallery img {
    width: 90px;      /* keep width same */
    height: 140px;   /* increased height */
    border-radius: 15px;
    object-fit: cover;
    box-shadow: 0 0 10px rgba(255,255,255,0.5);
    animation: fadeIn 1s ease;
}


</style>
</head>

<body>

<div class="card">
    <h1> HARI ! Will you be my Valentine? 💖</h1>
    <h5>don't say no,no is shy </h5>

    <div class="btn-container">
        <button id="yesBtn">Yes 💕</button>
        <button id="noBtn">No 🙈</button>
    </div>

    <div id="message"></div>
    <div id="photoGallery"></div>

</div>

<script>
const yesBtn = document.getElementById("yesBtn");
const noBtn = document.getElementById("noBtn");
const message = document.getElementById("message");
const container = document.querySelector(".btn-container");

// YES click
yesBtn.addEventListener("click", () => {
    message.textContent = "Yay!  you just made my heart the happiest 💘🥰";
    createHearts(25);
    showPhotos();
});

function showPhotos() {
    const gallery = document.getElementById("photoGallery");

    const photos = [
        "image/image2.jpg.jpeg",
        "image/image1.jpg.jpeg",
        "image/image3.jpg.jpeg"
    ];

    gallery.innerHTML = ""; // clear before adding

    photos.forEach(src => {
        const img = document.createElement("img");
        img.src = src;
        gallery.appendChild(img);
    });
}


// NO button movement
noBtn.addEventListener("mouseover", moveButton);
noBtn.addEventListener("touchstart", moveButton);

function moveButton() {
    const cWidth = container.clientWidth;
    const cHeight = container.clientHeight;
    const bWidth = noBtn.offsetWidth;
    const bHeight = noBtn.offsetHeight;

    const x = Math.random() * (cWidth - bWidth);
    const y = Math.random() * (cHeight - bHeight);

    noBtn.style.left = `${x}px`;
    noBtn.style.top = `${y}px`;
}

// Floating hearts generator
function createHearts(count) {
    for (let i = 0; i < count; i++) {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.textContent = "💖";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 6000);
    }
}

// Background hearts loop
setInterval(() => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.textContent = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (Math.random() * 3 + 4) + "s";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 6000);
}, 800);
</script>

</body>
</html>
